name: Apply TheRock RDNA4 compatibility patch

on:
  push:
    branches:
      - agent/therock-rdna4-support

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/therock-rdna4-support

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply compatibility patch
        run: python .github/scripts/apply_therock_rdna4_patch.py

      - name: Commit generated changes
        run: |
          rm .github/workflows/apply-therock-rdna4.yml
          rm .github/scripts/apply_therock_rdna4_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(rocm): support TheRock preview on RDNA4"
          git push origin HEAD:agent/therock-rdna4-support
